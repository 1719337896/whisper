name: SubWhisper
options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift
    # v1.0.0 起为 Argmax Open-Source SDK（含 WhisperKit / SpeakerKit / TTSKit）
    # 注意：v1.0.0 是 breaking release，API 与 0.x 不兼容
    from: 1.0.0

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_IDENTITY: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  SubWhisper:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/SubWhisper
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: ArgmaxOSS
        product: WhisperKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.subwhisper
        PRODUCT_NAME: SubWhisper
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
        # iPad Pro M4 支持 arm64
        ARCHS: arm64
        # 关闭不需要的签名相关
        CODE_SIGN_ENTITLEMENTS: ""
        ENABLE_BITCODE: NO
