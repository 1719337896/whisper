name: Build Unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build SubWhisper
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project SubWhisper.xcodeproj \
            -scheme SubWhisper

      - name: Build archive (unsigned)
        run: |
          xcodebuild build \
            -project SubWhisper.xcodeproj \
            -scheme SubWhisper \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM=""

      - name: Package into Payload/ (unsigned .ipa)
        run: |
          set -e
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -n 1)
          echo "App path: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry SubWhisper-unsigned.ipa Payload
          ls -lh SubWhisper-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubWhisper-unsigned-ipa
          path: SubWhisper-unsigned.ipa
          retention-days: 30

      - name: Upload zipped .app (fallback)
        uses: actions/upload-artifact@v4
        with:
          name: SubWhisper-app
          path: build/Build/Products/Release-iphoneos/*.app
          retention-days: 30
